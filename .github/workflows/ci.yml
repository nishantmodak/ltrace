name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.95.0
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p ltrace-local --all-targets --locked -- -D warnings
      - run: cargo test -p ltrace-local --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r examples/catalog/requirements.lock
      - run: python scripts/verify_workflow.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - run: npm run format:check --prefix desktop
      - run: npm run build --prefix desktop
      - run: npm run test:coverage --prefix desktop
  macos-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - run: rustup default 1.95.0
      - run: npm ci --prefix desktop
      - run: npm run desktop:build --prefix desktop
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify packaged CLI and skill
        run: |
          target/release/bundle/macos/ltrace.app/Contents/Resources/bin/ltrace-dev --version
          test -f target/release/bundle/macos/ltrace.app/Contents/Resources/skills/ltrace-debug/SKILL.md
