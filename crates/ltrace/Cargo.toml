[package]
name = "ltrace-local"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local OpenTelemetry evidence for coding agents and developers"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }

axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "io-util", "io-std"] }
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "trace", "with-serde"] }
prost = "0.14"
hex = "0.4"
flate2 = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
directories = "6"
fs2 = "0.4"
libc = "0.2"

[[bin]]
name = "ltrace-dev"
path = "src/main.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

